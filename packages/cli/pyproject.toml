[project]
name = "skillsmith-cli"
version = "0.1.0"
description = "skillsmith CLI: Typer entrypoint, bounded-parallel runner, aggregated reporting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "skillsmith-core",
    "skillsmith-adapters",
    "skillsmith-audit",
    "skillsmith-eval",
    "skillsmith-augment",
    "skillsmith-heal",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
skillsmith = "skillsmith_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmith_cli"]
