[project]
name = "skillsmith-eval"
version = "0.1.0"
description = "skillsmith eval: golden/regression tests, determinism/variance harness, triggering accuracy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "skillsmith-core",
    "skillsmith-adapters",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavier, optional integrations. Core eval works without them.
scored = ["deepeval>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmith_eval"]
