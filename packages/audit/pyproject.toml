[project]
name = "skillsmith-audit"
version = "0.1.0"
description = "skillsmith audit: parse + lint SKILL.md against best practices and classify work-blocks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "skillsmith-core",
    "skillsmith-adapters",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmith_audit"]
