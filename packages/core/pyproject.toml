[project]
name = "skillsmith-core"
version = "0.1.0"
description = "skillsmith core: models, config, autonomy policy, sandbox interface, git plumbing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmith_core"]
