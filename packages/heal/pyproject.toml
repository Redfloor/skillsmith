[project]
name = "skillsmith-heal"
version = "0.1.0"
description = "skillsmith heal: snapshot/diff MCP tool contracts, classify drift, propose repairs (human-in-the-loop)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "skillsmith-core",
    "skillsmith-adapters",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmith_heal"]
