[project]
name = "skillsmith"
version = "0.1.0"
description = "An agent with subskills that audits, optimizes, tests, and self-heals other agentic skills and prompt-based tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "skillsmith contributors" }]
keywords = ["llm", "agent", "skills", "mcp", "claude", "prompt-engineering", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# The umbrella distribution installs the whole workspace via path deps.
dependencies = [
    "skillsmith-core",
    "skillsmith-adapters",
    "skillsmith-audit",
    "skillsmith-augment",
    "skillsmith-eval",
    "skillsmith-heal",
    "skillsmith-cli",
]

[project.scripts]
skillsmith = "skillsmith_cli.main:app"

[project.urls]
Homepage = "https://github.com/redfloor/skillsmith"
Documentation = "https://redfloor.github.io/skillsmith"
Repository = "https://github.com/redfloor/skillsmith"
Changelog = "https://github.com/redfloor/skillsmith/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# uv workspace: every directory under packages/ is a member package, each with
# its own pyproject.toml. The root distribution wires them together via sources.
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
skillsmith-core = { workspace = true }
skillsmith-adapters = { workspace = true }
skillsmith-audit = { workspace = true }
skillsmith-augment = { workspace = true }
skillsmith-eval = { workspace = true }
skillsmith-heal = { workspace = true }
skillsmith-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "deepeval>=1.0; python_version < '4.0'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The umbrella package ships no code of its own; it is a metapackage.
bypass-selection = true

# ---------------------------------------------------------------------------
# Shared tool configuration (inherited by members that don't override).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "UP042",  # str+Enum is intentional (stable JSON values across pydantic versions)
    "B008",   # typer.Option(...) in defaults is the canonical Typer pattern
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/core/src",
    "packages/adapters/src",
    "packages/audit/src",
    "packages/augment/src",
    "packages/eval/src",
    "packages/heal/src",
    "packages/cli/src",
]

[[tool.mypy.overrides]]
module = ["promptfoo.*", "deepeval.*", "git.*", "pygit2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["skillsmith_core", "skillsmith_adapters", "skillsmith_audit", "skillsmith_eval"]
