name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + type-check + tests across OSes — skillsmith must run on Linux/macOS/Windows.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned Python
        run: uv python install ${{ matrix.python }}

      - name: Sync (frozen, from committed lockfile)
        run: uv sync --frozen --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (mypy strict)
        run: uv run mypy packages

      - name: Tests (pytest)
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Declarative promptfoo eval gate (deterministic assertions are ground truth).
  promptfoo-gate:
    name: promptfoo eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --frozen --all-packages
      # Self-eval: run skillsmith's own eval harness over the fixture corpus. The
      # promptfoo declarative configs run when present; the native harness is the floor.
      - name: skillsmith eval (fixtures)
        run: uv run skillsmith eval tests/fixtures/skills --max-parallel 4
