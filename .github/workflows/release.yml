name: Release

# Intentional release notes (Changesets-style): the human curates CHANGELOG.md under
# "Unreleased", and a tag push rolls it into a versioned section and publishes.
# SemVer is enforced by the tag shape (vMAJOR.MINOR.PATCH).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # for trusted publishing to PyPI (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen --all-packages

      # Quality gate before any artifact is built.
      - name: Verify
        run: |
          uv run ruff check .
          uv run mypy packages
          uv run pytest

      - name: Build all workspace packages
        run: uv build --all-packages

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Pull the top-most version section as the GitHub Release body.
          awk '/^## \[/{c++} c==1{print} c==2{exit}' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          body_path: RELEASE_NOTES.md
          # Only ship build artifacts. A bare `dist/*` also catches the `.gitignore`
          # that `uv build` drops in dist/, which GitHub then uploads as a stray asset.
          files: |
            dist/*.whl
            dist/*.tar.gz

      # Trusted publishing (OIDC) — no stored token. Opt-in: set the repository
      # variable PYPI_PUBLISH=true once a PyPI trusted publisher is configured for
      # this repo. Until then the GitHub Release is still created above; this step
      # is skipped so tagging exercises the pipeline green instead of failing on a
      # missing publisher. (Settings → Secrets and variables → Actions → Variables.)
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH == 'true'
        run: uv publish
